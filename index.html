<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemical 모니터링 이력관리</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2430;--sub:#667085;--line:#e2e6ec;--accent:#2563eb;--accent-ink:#fff;--open:#d97706;--open-bg:#fef3c7;--done:#15803d;--done-bg:#dcfce7;--bar:#3b82f6;--danger:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--ink:#e6ebf2;--sub:#93a0b2;--line:#2a3544;--accent:#4f8cff;--accent-ink:#06142e;--open:#fbbf24;--open-bg:#3a2d0b;--done:#4ade80;--done-bg:#12301d;--bar:#5b9bff;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0 12px 0 0}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--sub);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
nav button.on{background:var(--accent);color:var(--accent-ink)}
.sp{flex:1}
main{max-width:1200px;margin:0 auto;padding:20px}
main.wide{max-width:1620px}
.dashwrap{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
#chat{position:sticky;top:76px;height:calc(100vh - 96px);min-height:420px;display:flex;flex-direction:column;padding:0;margin:0;overflow:hidden}
@media(max-width:1100px){.dashwrap{grid-template-columns:minmax(0,1fr)}#chat{position:static;height:600px}}
.dashwrap.nochat{grid-template-columns:minmax(0,1fr)}
.dashwrap.nochat #chat{display:none}
.chat-h{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.chat-h .btn{padding:3px 9px;font-size:12px}
.chat-cfg{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.chat-cfg label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.chat-cfg input:not([type=checkbox]){display:block;width:100%;margin-top:2px}
.chat-cfg .chk{display:flex;gap:6px;align-items:center}
.chat-cfg p{margin:4px 0 0;font-size:11px}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg-u,.msg-a{max-width:92%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.msg-u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg-a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg-a.err{border-color:var(--danger);color:var(--danger)}
.msg-a details{margin-top:6px;font-size:12px;color:var(--sub);white-space:normal}
.msg-a details li{cursor:pointer;margin:2px 0}.msg-a details li:hover{text-decoration:underline}
.msg-a details ul{margin:4px 0 0;padding-left:16px;max-height:150px;overflow:auto}
.chat-qs{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.qchip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}
.chat-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
.chat-in textarea{min-height:0;height:56px;font-family:inherit;font-size:13px;resize:none;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:26px;line-height:1.2}
.kpi span{color:var(--sub);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
button.btn,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.dng{color:var(--danger)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:150px;font-family:Consolas,monospace;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);white-space:nowrap}
td.c{white-space:pre-wrap;word-break:break-word;min-width:260px}
.tbl{overflow-x:auto}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.o{background:var(--open-bg);color:var(--open)}
.badge.d{background:var(--done-bg);color:var(--done)}
.badge.cat{background:var(--line);color:var(--ink);font-weight:500}
.badge.cat.man{outline:1.5px solid var(--accent)}
:root{--c0:#2563eb;--c1:#dc2626;--c2:#16a34a;--c3:#d97706;--c4:#7c3aed;--c5:#0891b2;--c6:#db2777;--c7:#64748b}
@media (prefers-color-scheme:dark){:root{--c0:#60a5fa;--c1:#f87171;--c2:#4ade80;--c3:#fbbf24;--c4:#a78bfa;--c5:#22d3ee;--c6:#f472b6;--c7:#94a3b8}}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer;font:inherit;font-size:12px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg.off{opacity:.45;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:3px 12px;cursor:pointer;font:inherit;font-size:12px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip b{margin-left:4px}
.hb{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;margin:5px 0;cursor:pointer}
.hb .t{height:16px;background:var(--line);border-radius:4px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--bar)}
.hb .n{text-align:right;font-weight:600}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--sub)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--sub);margin-bottom:12px}
.drop.hov{border-color:var(--accent);background:var(--open-bg)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
.map label{display:block;font-size:12px;color:var(--sub)}
.map select{width:100%}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(560px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;margin:10px 0 3px;font-size:12px;color:var(--sub)}
dialog input,dialog textarea{width:100%}
dialog textarea{min-height:120px;font-family:inherit;font-size:14px}
.msg{padding:10px 14px;border-radius:8px;background:var(--done-bg);color:var(--done);margin-bottom:12px;font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>🧪 Chemical 모니터링 이력관리</h1>
  <nav>
    <button data-v="dash" class="on">대시보드</button>
    <button data-v="hist">이력 조회</button>
    <button data-v="imp">가져오기</button>
    <button data-v="set">백업/설정</button>
  </nav>
  <span class="sp"></span>
  <button class="btn" id="chatToggle" type="button" aria-pressed="true">🤖 챗봇 숨기기</button>
  <button class="btn pri" id="addBtn">+ 직접 입력</button>
</header>
<main>
  <section id="v-dash"><div class="dashwrap"><div id="dashMain"></div>
    <aside id="chat" class="card">
      <div class="chat-h"><b>🤖 데이터 질문 챗봇</b><span class="sp"></span><button type="button" class="btn" id="chatCfgBtn">⚙ 설정</button><button type="button" class="btn" id="chatClear">지우기</button><button type="button" class="btn" id="chatClose" title="챗봇 숨기기" aria-label="챗봇 숨기기">✕</button></div>
      <div id="chatCfg" class="chat-cfg hide">
        <label>base_url<input id="cBase" placeholder="예: https://api.openai.com/v1" autocomplete="off"></label>
        <label>model_name<input id="cModel" placeholder="예: gpt-4o-mini" autocomplete="off"></label>
        <label>api_key<input id="cKey" type="password" placeholder="sk-..." autocomplete="off"></label>
        <label class="chk"><input type="checkbox" id="cRem"> 이 브라우저에 api_key 저장 (끄면 이 탭을 닫을 때까지만 기억)</label>
        <p class="muted">OpenAI 호환 방식(<code>base_url/chat/completions</code>)으로 호출합니다. 질문할 때 질문과 관련된 이력 일부와 통계가 위 서버로 전송됩니다. 입력값은 백업 파일에 포함되지 않습니다.</p>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <div id="chatQs" class="chat-qs"></div>
      <div class="chat-in"><textarea id="chatIn" rows="2" placeholder="이력·대시보드 데이터에 대해 질문하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea><button type="button" class="btn pri" id="chatSend">보내기</button></div>
    </aside></div></section>
  <section id="v-hist" class="hide"></section>
  <section id="v-imp" class="hide"></section>
  <section id="v-set" class="hide"></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle" style="margin:0 0 6px;font-size:16px"></h2>
    <label>날짜</label><input type="date" id="fDate" required>
    <label>설비명</label><input id="fEquip" list="equipList" required>
    <label>현재상태</label><input id="fStatus" list="statusList" placeholder="예: 진행중 / 조치완료">
    <label>내용 (특이사항 · 조치방안)</label><textarea id="fContent" required></textarea>
    <label>현상 분류 (특이사항)</label><select id="fCat" style="width:100%"></select>
    <label>조치방법 분류 (조치 전이면 공란)</label><select id="fAct" style="width:100%"></select>
    <div id="fHistory"class="muted" style="font-size:12px;margin-top:8px"></div>
    <div class="row" style="margin:16px 0 0">
      <button type="button" class="btn dng" id="fDel">삭제</button><span class="sp"></span>
      <button type="button" class="btn" id="fCancel">취소</button>
      <button type="submit" class="btn pri" id="fSave">저장</button>
    </div>
  </form>
</dialog>
<datalist id="equipList"></datalist><datalist id="statusList"></datalist>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const LS='chemMonitorDB_v1';
const DEF_DONE='완료,종결,해결,정상,close,done,complete';
// 자동 분류 기본 규칙: "분류명: 키워드, 키워드 ..." (한 줄에 한 분류). 동점이면 위쪽 분류 우선.
const mkRules=a=>a.map(x=>x[0]+': '+x[1]).join('\n');
// 현상: 내용에서 가장 오래된 줄(최초 발생 내용)만 보고 판정. 보통 최신이 위라서 맨 아랫줄입니다.
const DEF_PHEN=mkRules([
 ['감도·Signal 저하/Drift','감도,drift,신호,회수율,internal standard,is,rsd,급감'],
 ['간섭·검량 이상','검량,r²,간섭,bec,collision,매질'],
 ['시료 도입 불량(흡입·막힘·배수)','autosampler,흡입,막힘,배수,drain,probe,spray chamber,pump,소음'],
 ['Plasma 불안정·점화 불량','plasma,점화,소등,reflected,rf,torch'],
 ['유량·압력·온도 이상','압력,유량,온도,알람,chiller,cooling,ar gas,he gas,mfc,변동'],
 ['통신·소프트웨어 오류','통신,소프트웨어,라이선스,저장,에러,pc'],
 ['Blank·농도 상승(오염)','blank,농도,spike,상승,오염,carry-over,carryover,잔류,편차,용출,컨테이너']
]);
// 조치방법: 조치가 적힌 줄에서 판정(요청·협의·예정 등이 있는 줄은 제외). 안 맞으면 공란
const DEF_ACT=mkRules([
 ['부품·소모품 교체','교체,replace'],
 ['설정·조건 조정','조건 변경,설정,보정,조정,최적화,튜닝,tuning,장력,윤활,연장,단축,레시피'],
 ['세정·Flushing·Purge','세정,flushing,초음파,세척,air 빼기,purge'],
 ['시료·표준액 재준비','재조제,재작성,재샘플링,재채취,lot'],
 ['재가동·재연결','재시작,재체결,재활성화,재점화,재장착,케이블'],
 ['절차·교육 개선','교육,기준 공유'],
 ['점검 후 이상 없음','점검,이상 없음']
]);
let db={records:[],settings:{doneWords:DEF_DONE}};
try{const s=localStorage.getItem(LS);if(s){const p=JSON.parse(s);db.records=p.records||[];db.settings=Object.assign(db.settings,p.settings||{})}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){alert('브라우저 저장에 실패했습니다. 백업 파일을 내보내 주세요.\n'+e.message)}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').replace(/\s+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// 내용에서 '최초 발생 줄' 찾기. 줄 앞의 (월/일)로 순서를 판단: 맨 위 줄이 더 오래됐으면 시간순(위=최초), 아니면 최신이 위(아래=최초).
// 날짜가 없거나 같으면 맨 아랫줄을 최초 발생으로 봅니다(보통 최신이 위).
const MD=/^\s*\(\s*(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*\)/;
function originLine(content){
  const ls=String(content??'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(ls.length<2)return ls[0]||'';
  const v=l=>{const m=l.match(MD);return m?(+m[1])*31+(+m[2]):null};
  const a=v(ls[0]),b=v(ls[ls.length-1]);
  if(a!=null&&b!=null){const d=(((b-a+186)%372)+372)%372-186;if(d>0)return ls[0]}
  return ls[ls.length-1];
}
// 같은 건 판정: 날짜+설비+최초 발생 줄. 내용이 위/아래로 쌓여도 같은 건으로 인식
const keyOf=(d,e,c)=>[d,norm(e).toLowerCase(),norm(originLine(c)).toLowerCase()].join('|');
const doneWords=()=>db.settings.doneWords.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
const isOpen=r=>{const s=norm(r.status).toLowerCase();return !doneWords().some(w=>s.includes(w))};
/* ---------- 자동 분류 (현상 / 조치방법) ---------- */
const OTHER='기타';
const PENDING=/요청|협의|조율|예정|필요|전까지|검토/;   // 아직 하지 않은 일이 적힌 줄은 조치로 보지 않음
const _rc={};
function rulesOf(key,def){
  const t=db.settings[key]||def;
  if(_rc[key]&&_rc[key].t===t)return _rc[key].c;
  const c=t.split('\n').map(l=>{const i=l.indexOf(':');if(i<1)return null;
    const ws=l.slice(i+1).split(',').map(w=>w.trim().toLowerCase()).filter(Boolean);
    return {name:l.slice(0,i).trim(),ws:ws.map(w=>/^[\x20-\x7e]+$/.test(w)?{re:new RegExp('(?<![a-z0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z0-9])')}:{s:w})}}).filter(Boolean);
  _rc[key]={t,c};return c;
}
const phenRules=()=>rulesOf('phenRules',DEF_PHEN),actRules=()=>rulesOf('actRules',DEF_ACT);
const phenNames=()=>phenRules().map(c=>c.name).concat(OTHER),actNames=()=>actRules().map(c=>c.name);
function bestOf(rules,text,none){   // 키워드가 가장 많이 들어 있는 분류(동점이면 위쪽), 없으면 none
  let best=none,bs=0;
  for(const c of rules){let s=0;for(const w of c.ws)if(w.re?w.re.test(text):text.includes(w.s))s++;if(s>bs){bs=s;best=c.name}}
  return best;
}
const autoPhen=r=>bestOf(phenRules(),originLine(r.content).toLowerCase(),OTHER);
const autoAct=r=>bestOf(actRules(),String(r.content||'').split('\n').filter(l=>l.trim()&&!PENDING.test(l)).join('\n').toLowerCase(),'');
const phenOf=r=>r.cat&&phenNames().includes(r.cat)?r.cat:autoPhen(r);
const actOf=r=>r.act==='__none'?'':(r.act&&actNames().includes(r.act)?r.act:autoAct(r));
const phenBadge=r=>`<span class="badge cat${r.cat?' man':''}" title="${r.cat?'수동 지정':'자동 분류'}">${esc(phenOf(r))}</span>`;
const actBadge=r=>{const a=actOf(r);return a?`<span class="badge cat${r.act&&r.act!=='__none'?' man':''}" title="${r.act&&r.act!=='__none'?'수동 지정':'자동 분류'}">${esc(a)}</span>`:`<span class="muted"${r.act==='__none'?' title="수동 지정: 조치 없음"':''}>—</span>`};
const badge=r=>`<span class="badge ${isOpen(r)?'o':'d'}">${esc(r.status||'미확인')}</span>`;
const today=()=>{const d=new Date();return fmtDate(d)};
function pad(n){return String(n).padStart(2,'0')}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

/* ---------- 날짜 변환 ---------- */
function parseDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return fmtDate(new Date(v.getTime()+30000));
  if(typeof v==='number'&&v>20000&&v<80000){return fmtDate(new Date(Math.round((v-25569)*86400000)+43200000-0)).replace(/^/,'')}
  let s=String(v).trim(),m;
  if(m=s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=s.match(/^(\d{4})(\d{2})(\d{2})$/))return m[1]+'-'+m[2]+'-'+m[3];
  if(m=s.match(/^(\d{2})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})$/))return '20'+m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=s.match(/^(\d{1,2})\s*[/.\-월]\s*(\d{1,2})일?$/))return new Date().getFullYear()+'-'+pad(+m[1])+'-'+pad(+m[2]);
  return '';
}

/* ---------- 붙여넣기(TSV) 파서: 따옴표 안의 줄바꿈 지원 ---------- */
function parseTSV(t){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&cur==='')q=true;
    else if(c==='\t'){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>norm(x)!==''));
}

  const v=i=>+$('#'+i).value,rows=imp.hdr?imp.rows.slice(1):imp.rows,out=[],bad=[];
  rows.forEach((r,n)=>{
    const date=parseDate(r[v('mDate')]),equip=v('mEquip')<0?'':norm(r[v('mEquip')]),
      status=v('mStatus')<0?'':norm(r[v('mStatus')]);
    let content=v('mContent')<0?'':String(r[v('mContent')]??'').trim();
    if(v('mContent2')>=0){const c2=String(r[v('mContent2')]??'').trim();if(c2)content+=(content?'\n':'')+c2}
    if(!date||!equip||!content){bad.push(n+(imp.hdr?2:1));return}
    out.push({date,equip,status,content});
  });
  return {out,bad};
}
function plan(out){
  const map=new Map(db.records.map(r=>[keyOf(r.date,r.equip,r.content),r]));
  const add=[],upd=[],dup=[];
  out.forEach(o=>{const k=keyOf(o.date,o.equip,o.content),ex=map.get(k);
    if(!ex){add.push(o);map.set(k,o)}
    else if(db.records.includes(ex)&&((o.status&&norm(ex.status)!==o.status)||norm(ex.content)!==norm(o.content)))upd.push([ex,o]);
    else dup.push(o)});
  return {add,upd,dup};
}

const P2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+P2(d.getMonth()+1)+'-'+P2(d.getDate());
// 질문 속 날짜/기간 표현 -> [시작,끝] 목록
function qRanges(q){
  const out=[],t=new Date(),Y=t.getFullYear(),M=t.getMonth()+1,mEnd=(y,m)=>new Date(y,m,0).getDate();
  const month=(y,m)=>out.push([y+'-'+P2(m)+'-01',y+'-'+P2(m)+'-'+P2(mEnd(y,m))]);
  const day=(y,m,d)=>out.push([y+'-'+P2(m)+'-'+P2(d),y+'-'+P2(m)+'-'+P2(d)]);
  const yr=m=>m>M?Y-1:Y;
  let m,s=q;
  const re1=/(\d{4})\s*[-./년]\s*(\d{1,2})(?:\s*[-./월]\s*(\d{1,2}))?/g;
  while((m=re1.exec(q))){const mo=+m[2];if(mo<1||mo>12)continue;m[3]?day(+m[1],mo,+m[3]):month(+m[1],mo)}
  s=q.replace(re1,' ');
  const re2=/(?<!\d)(\d{1,2})\s*월(?:\s*(\d{1,2})\s*일)?/g;
  while((m=re2.exec(s))){const mo=+m[1];if(mo<1||mo>12)continue;m[2]?day(yr(mo),mo,+m[2]):month(yr(mo),mo)}
  const re3=/(?<!\d)(\d{1,2})\/(\d{1,2})(?!\d)/g;
  while((m=re3.exec(s))){const mo=+m[1];if(mo>=1&&mo<=12)day(yr(mo),mo,+m[2])}
  if(/이번\s*달/.test(q))month(Y,M);
  if(/(지난|저번)\s*달/.test(q)){const p=new Date(Y,M-2,1);month(p.getFullYear(),p.getMonth()+1)}
  if(/오늘/.test(q))out.push([ymd(t),ymd(t)]);
  if(/어제/.test(q)){const p=new Date(t);p.setDate(p.getDate()-1);out.push([ymd(p),ymd(p)])}
  const rel=(n)=>{const p=new Date(t);p.setDate(p.getDate()-n);out.push([ymd(p),ymd(t)])};
  if((m=q.match(/최근\s*(\d+)\s*(일|주|개월|달)/))){rel(+m[1]*({'일':1,'주':7,'개월':30,'달':30}[m[2]]))}
  if(/최근\s*(한\s*달|1\s*달)/.test(q))rel(30);
  if(/최근\s*(일주일|한\s*주)/.test(q))rel(7);
  return out;
}
const STOP=new Set(['알려줘','알려주세요','설비','발생','현상','어떤','있어','있나요','대해','요약','최근','건수','얼마나','무엇','해줘','이력','내용','데이터','정리','보여줘','그리고','어떻게','했어','했나요','많이','가장','언제','어디','이번','지난']);
function qTokens(q){
  const ts=q.toLowerCase().match(/[a-z0-9²][a-z0-9²\-.]*|[가-힣]{2,}/g)||[];
  const out=new Set();
  ts.forEach(t=>{if(t.length<2||STOP.has(t))return;out.add(t);if(/[가-힣]/.test(t)&&t.length>=3){out.add(t.slice(0,-1))}});
  return [...out].filter(t=>!STOP.has(t));
}
const countBy=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const fmtC=(e,lim)=>{const s=e.slice(0,lim||40).map(([k,n])=>k+' '+n+'건').join(', ');return e.length>(lim||40)?s+' 외 '+(e.length-(lim||40))+'개 항목':s};
function recLine(r){
  const c=String(r.content||'').split('\n').map(l=>l.trim()).filter(Boolean).join(' / ');
  return `${r.date} | ${r.equip} | 상태: ${r.status||'미확인'}(${isOpen(r)?'미조치':'조치완료'}) | 현상: ${phenOf(r)} | 조치방법: ${actOf(r)||'공란(조치 전)'} | 내용: ${c.length>500?c.slice(0,500)+'…':c}`;
}
// 질문과 관련 있는 이력 일부 + 전체 통계를 근거 자료로 만든다
function buildContext(q){
  const R=db.records;if(!R.length)return null;
  const ql=q.toLowerCase(),open=R.filter(isOpen),dates=R.map(r=>r.date).sort();
  const months=countBy(R,r=>r.date.slice(0,7)).sort((a,b)=>a[0]<b[0]?-1:1);
  const stats=[
   `오늘 날짜: ${today()}`,
   `전체 이력 ${R.length}건 (날짜 범위 ${dates[0]} ~ ${dates[dates.length-1]}), 설비 ${new Set(R.map(r=>r.equip)).size}개`,
   `미조치(진행중) 기준: 현재상태에 [${doneWords().join(', ')}] 중 하나라도 없으면 미조치. 미조치 ${open.length}건, 조치완료 ${R.length-open.length}건`,
   `상태별: ${fmtC(countBy(R,r=>r.status||'미확인'))}`,
   `설비별 발생 건수: ${fmtC(countBy(R,r=>r.equip),60)}`,
   `설비별 미조치 건수: ${fmtC(countBy(open,r=>r.equip),60)||'없음'}`,
   `월별 발생 건수: ${fmtC(months,36)}`,
   `이번 달(${today().slice(0,7)}) 발생: ${R.filter(r=>r.date.startsWith(today().slice(0,7))).length}건`,
   `현상별 건수: ${fmtC(countBy(R,r=>phenOf(r)))}`,
   `조치방법별 건수: ${fmtC(countBy(R,r=>actOf(r)||'공란(조치 전)'))}`,
   `현상별 × 조치방법 조합 상위: ${fmtC(countBy(R,r=>phenOf(r)+' → '+(actOf(r)||'공란')),15)}`
  ].join('\n');
  const picked=new Map(),add=r=>picked.set(r.id,r);
  const byDate=(a,b)=>a.date<b.date?1:a.date>b.date?-1:0;
  const eqHit=[...new Set(R.map(r=>r.equip))].filter(e=>ql.includes(e.toLowerCase()));
  if(eqHit.length)R.filter(r=>eqHit.includes(r.equip)).sort(byDate).slice(0,40).forEach(add);
  const rg=qRanges(q);
  if(rg.length)R.filter(r=>rg.some(([a,b])=>r.date>=a&&r.date<=b)).sort(byDate).slice(0,40).forEach(add);
  const tk=qTokens(q);
  if(tk.length){
    R.map(r=>{const t=(r.equip+' '+r.status+' '+phenOf(r)+' '+(actOf(r)||'')+' '+r.content).toLowerCase();let s=0;tk.forEach(w=>{if(t.includes(w))s++});return [s,r]})
     .filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]||byDate(a[1],b[1])).slice(0,30).forEach(x=>add(x[1]));
  }
  open.sort(byDate).slice(0,20).forEach(add);   // 미조치 건은 항상 일부 포함
  const recs=[...picked.values()].sort(byDate).slice(0,70);
  return {text:`[통계 — 전체 데이터 기준]\n${stats}\n\n[참고 이력 ${recs.length}건 — 질문과 관련 있어 보이는 일부, 최신 날짜순. 내용은 줄마다 (월/일) 경과 기록이며 보통 최신이 위, 맨 아래가 최초 발생]\n${recs.map(recLine).join('\n')}`,recs};
}
const SYS=`당신은 Chemical(ICP-MS) 모니터링 설비의 특이사항·조치 이력 데이터를 설명해 주는 도우미입니다.
규칙:
1) 아래 [데이터]에 있는 내용만 근거로 답하세요. 데이터에 없으면 "제공된 데이터에서는 확인할 수 없습니다"라고 답하고, 추측하거나 일반 상식으로 채우지 마세요.
2) 답변에는 근거가 된 설비명과 날짜를 함께 적으세요. (예: AECB11, 2026-10-12)
3) 전체 건수·합계는 [통계]의 숫자를 사용하세요. [참고 이력]은 일부만 담겨 있으므로 그 목록의 개수를 전체 건수라고 말하지 마세요.
4) 사용자는 반도체 엔지니어입니다. 쉬운 한국어로 핵심부터 짧게 정리하세요. 목록이 필요하면 간단한 글머리표를 쓰세요.

[데이터]
`;
function chatLog(){
  const el=$('#chatLog');
  el.innerHTML=chat.msgs.map((m,i)=>m.role==='user'?`<div class="msg-u">${esc(m.text)}</div>`:
    `<div class="msg-a${m.err?' err':''}">${esc(m.text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}${m.refs&&m.refs.length?`<details><summary>참고한 이력 ${m.refs.length}건 보기</summary><ul>${m.refs.map(r=>`<li data-id="${esc(r.id)}">${esc(r.date)} · ${esc(r.equip)} · ${esc(r.status||'미확인')}</li>`).join('')}</ul></details>`:''}</div>`).join('')
    +(chat.busy?'<div class="msg-a muted">답변을 만드는 중…</div>':'');
  el.scrollTop=el.scrollHeight;
}
function chatQs(){
  const qs=['미조치 건을 요약해줘','가장 자주 발생한 설비와 현상은?','이번 달 발생 현황을 알려줘','감도 저하는 보통 어떻게 해결했어?'];
  $('#chatQs').innerHTML=chat.msgs.length?'':qs.map(q=>`<button type="button" class="qchip">${esc(q)}</button>`).join('');
  document.querySelectorAll('#chatQs .qchip').forEach(b=>b.onclick=()=>{$('#chatIn').value=b.textContent;sendChat()});
}
async function sendChat(){
  if(chat.busy)return;
  const q=$('#chatIn').value.trim();if(!q)return;
  const c=chat.cfg;
  if(!c.base||!c.model||!c.key){$('#chatCfg').classList.remove('hide');chat.msgs.push({role:'user',text:q,failed:true},{role:'assistant',err:true,text:'base_url, model_name, api_key를 먼저 입력해 주세요. (위 설정 칸)'});$('#chatIn').value='';chatLog();chatQs();return}
  $('#chatIn').value='';
  chat.msgs.push({role:'user',text:q});
  const ctx=buildContext(q);
  if(!ctx){chat.msgs.push({role:'assistant',text:'아직 저장된 이력이 없습니다. 가져오기 탭에서 데이터를 먼저 올려 주세요.'});chatLog();chatQs();return}
  chat.busy=true;chatLog();chatQs();$('#chatSend').disabled=true;
  const hist=chat.msgs.slice(0,-1).filter(m=>!m.err&&!m.failed).slice(-8).map(m=>({role:m.role,content:m.text}));
  const url=c.base.replace(/\/+$/,'')+(/\/chat\/completions$/.test(c.base.replace(/\/+$/,''))?'':'/chat/completions');
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),120000);
  try{
    const res=await fetch(url,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model:c.model,temperature:0.2,messages:[{role:'system',content:SYS+ctx.text},...hist,{role:'user',content:q}]})});
    const raw=await res.text();let j=null;try{j=JSON.parse(raw)}catch(e){}
    if(!res.ok)throw new Error('서버 응답 오류 ('+res.status+') '+((j&&(j.error&&(j.error.message||j.error)||j.message))||raw.slice(0,200)));
    const a=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!a)throw new Error('응답에서 답변을 찾지 못했습니다: '+raw.slice(0,200));
    chat.msgs.push({role:'assistant',text:String(a).trim(),refs:ctx.recs.map(r=>({id:r.id,date:r.date,equip:r.equip,status:r.status}))});
  }catch(e){
    const hint=(e.name==='AbortError')?'응답 시간이 너무 오래 걸려 중단했습니다.':(e instanceof TypeError?'서버에 연결하지 못했습니다. 주소(base_url)가 맞는지, 네트워크가 연결되어 있는지 확인해 주세요. 주소가 맞다면 브라우저에서 직접 호출하는 것을 서버가 막은 것(CORS)일 수 있어, 서버 관리자에게 이 페이지 주소의 접근 허용을 요청해야 합니다.':e.message);
    chat.msgs[chat.msgs.length-1].failed=true;   // 실패한 질문은 다음 요청의 대화 기록에서 뺀다
    chat.msgs.push({role:'assistant',err:true,text:hint});
  }finally{clearTimeout(to);chat.busy=false;$('#chatSend').disabled=false;chatLog();chatQs()}
}
(function initChat(){
  $('#cBase').value=chat.cfg.base;$('#cModel').value=chat.cfg.model;$('#cKey').value=chat.cfg.key;$('#cRem').checked=chat.cfg.remember;
  if(!chat.cfg.base||!chat.cfg.model||!chat.cfg.key)$('#chatCfg').classList.remove('hide');
  const sync=()=>{chat.cfg.base=$('#cBase').value.trim();chat.cfg.model=$('#cModel').value.trim();chat.cfg.key=$('#cKey').value.trim();chat.cfg.remember=$('#cRem').checked;saveChatCfg()};
  ['cBase','cModel','cKey','cRem'].forEach(i=>$('#'+i).oninput=sync);
  $('#cRem').onchange=sync;
  $('#chatToggle').onclick=()=>setChatHidden(!chatHidden);
  $('#chatClose').onclick=()=>setChatHidden(true);
  $('#chatCfgBtn').onclick=()=>$('#chatCfg').classList.toggle('hide');
  $('#chatClear').onclick=()=>{if(chat.busy)return;chat.msgs=[];chatLog();chatQs()};
  $('#chatSend').onclick=sendChat;
  $('#chatIn').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat()}};
  $('#chatLog').onclick=e=>{const li=e.target.closest('li[data-id]');if(li)openDlg(li.dataset.id)};
  chatLog();chatQs();
})();
render();
</script>
